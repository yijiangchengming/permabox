# Merge into the existing containerd 2.x v3 configuration; keep one top-level version.
version = 3

[plugins."io.containerd.cri.v1.runtime".containerd.runtimes.permabox]
  runtime_type = "io.containerd.runc.v2"
  pod_annotations = ["permabox.io/persist", "permabox.io/container", "permabox.io/storage-root", "permabox.io/underlying-runtime"]

[plugins."io.containerd.cri.v1.runtime".containerd.runtimes.permabox.options]
  BinaryName = "/usr/local/bin/permabox"
  # Match the node's cgroup driver (true for systemd).
  SystemdCgroup = true
