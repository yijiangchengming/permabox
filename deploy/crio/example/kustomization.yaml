apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../..
patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: permabox-demo
    patch: |-
      - op: replace
        path: /spec/template/spec/runtimeClassName
        value: permabox-crio
