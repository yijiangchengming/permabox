# For a dedicated CRI-O VFS node. Do not install over an existing overlay store.
[crio]
root = "/var/lib/containers/permabox-crio-vfs"
runroot = "/run/containers/permabox-crio-vfs"
storage_driver = "vfs"

[crio.runtime.runtimes.permabox]
runtime_path = "/usr/local/bin/permabox"
runtime_type = "oci"
runtime_root = "/run/runc-permabox-crio"
# Set monitor_path here if conmon is not discoverable on the CRI-O service PATH.
# Do not add permabox.io/* keys to allowed_annotations.
