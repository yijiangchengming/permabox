{{- $image := .Values.bridgeImage | default dict -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "permabox.bridgeName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "permabox.bridgeLabels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "permabox.bridgeLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "permabox.bridgeLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "permabox.workloadGCName" . }}
      automountServiceAccountToken: true
      {{- include "permabox.scheduling" . | nindent 6 }}
      containers:
        - name: bridge
          image: {{ printf "%s:%s" (default .Values.image.repository $image.repository) (default (default .Chart.AppVersion .Values.image.tag) $image.tag) | quote }}
          imagePullPolicy: {{ default .Values.image.pullPolicy $image.pullPolicy }}
          # DirectoryOrCreate starts at 0755. Let the bridge roll independently.
          command:
            - /bin/sh
            - -ec
            - |
              dir=/host/opt/permabox-k3s
              mode=$(stat -c %a -- "$dir")
              if [ ! -d "$dir" ] || [ -L "$dir" ] || [ "$(stat -c %u -- "$dir")" != 0 ] || [ "$((0$mode & 0022))" -ne 0 ]; then
                echo 'permabox-k3s: unsafe bridge directory' >&2
                exit 1
              fi
              if [ "$mode" != 700 ]; then chmod 0700 "$dir"; fi
              exec /usr/local/bin/permabox-k3s bridge
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: OWNER
              value: {{ printf "%s/%s" .Release.Namespace .Release.Name | quote }}
          readinessProbe:
            timeoutSeconds: 5
            exec:
              command: ["/usr/local/bin/permabox-k3s", "bridge-health"]
          volumeMounts:
            - name: bridge-state
              mountPath: /host/opt/permabox-k3s
      volumes:
        - name: bridge-state
          hostPath:
            path: /opt/permabox-k3s-bridge
            type: DirectoryOrCreate
