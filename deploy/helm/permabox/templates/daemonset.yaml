apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "permabox.installerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "permabox.selectorLabels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "permabox.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "permabox.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      hostPID: true
      {{- include "permabox.scheduling" . | nindent 6 }}
      containers:
        - name: installer
          image: {{ printf "%s:%s" (required "set image.repository to the PermaBox installer image repository" .Values.image.repository) (default .Chart.AppVersion .Values.image.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/permabox-k3s"]
          securityContext:
            privileged: true
            runAsUser: 0
          env:
            - name: MODE
              value: {{ .Values.mode | quote }}
            - name: ALLOW_LEGACY_WRAPPER_MIGRATION
              value: {{ default false .Values.allowLegacyWrapperMigration | quote }}
            - name: OWNER
              value: {{ printf "%s/%s" .Release.Namespace .Release.Name | quote }}
            - name: HOST_ROOT
              value: /host
            - name: K3S_DATA_DIR
              value: {{ .Values.k3s.dataDir | quote }}
            - name: K3S_CRI_ENDPOINT
              value: {{ .Values.k3s.criEndpoint | quote }}
            - name: K3S_SERVICE
              value: {{ .Values.k3s.service | quote }}
            - name: K3S_BIN
              value: {{ .Values.k3s.bin | quote }}
            - name: STORAGE_ROOT
              value: {{ .Values.storageRoot | quote }}
            - name: TRUSTED_NAMESPACES
              value: {{ default (list) .Values.trustedNamespaces | toJson | quote }}
            - name: UNDERLYING_RUNTIME
              value: {{ .Values.underlyingRuntime | quote }}
            - name: STORAGE_ROOTS
              value: {{ default dict .Values.storageRoots | toJson | quote }}
            - name: UNDERLYING_RUNTIMES
              value: {{ default dict .Values.underlyingRuntimes | toJson | quote }}
            - name: GC_IDLE_TTL
              value: {{ default "0s" .Values.gcIdleTTL | quote }}
            - name: GC_ON_WORKLOAD_DELETE
              value: {{ .Values.gcOnWorkloadDelete | quote }}
            - name: GC_ON_SCALE_TO_ZERO
              value: {{ .Values.gcOnScaleToZero | quote }}
            - name: GC_WORKLOAD_ANNOTATIONS
              value: {{ .Values.gcWorkloadAnnotations | quote }}
            - name: GC_INTERVAL_SECONDS
              value: {{ default 60 .Values.gcIntervalSeconds | quote }}
            - name: PERSIST_ANNOTATION
              value: {{ .Values.persistAnnotation | quote }}
          readinessProbe:
            timeoutSeconds: 5
            exec:
              {{- if eq .Values.mode "install" }}
              command: ["/bin/sh", "-c", "test -f /tmp/permabox-ready && /usr/local/bin/permabox-k3s bridge-health --node"]
              {{- else }}
              command: ["test", "-f", "/tmp/permabox-ready"]
              {{- end }}
          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: false
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
