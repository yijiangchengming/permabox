name: Compatibility / k0s

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k0s:
    name: k0s 1.36.4 / managed containerd v3 / runc
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build PermaBox
        run: make build
      - name: Download and verify upstream k0s
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            'https://github.com/k0sproject/k0s/releases/download/v1.36.4%2Bk0s.1/k0s-v1.36.4%2Bk0s.1-amd64' \
            --output permabox-k0s
          echo '18c304d53cdd70095e99c6b859b269b4fef0bb84579d7e7185271a9135694a31  permabox-k0s' | sha256sum -c -
          chmod 0755 permabox-k0s
      - name: Prepare the native Kubernetes node
        run: |
          sudo swapoff -a
          sudo modprobe overlay
          sudo modprobe br_netfilter
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1
      - name: Verify StatefulSet persistence and reclamation
        run: bash deploy/k0s/smoke_test.sh "$RUNNER_TEMP/permabox-k0s"
